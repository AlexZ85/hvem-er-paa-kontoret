<!DOCTYPE html>
<html>
<head>
    <title>Clickable Image Example</title>
    <style>
        .clickable-area {
            display: block;
            position: absolute;
            background-color: transparent;
            cursor: pointer;
        }

        .highlight {
            background-color: yellow;
        }
    </style>
</head>
<body>
    <h1>Clickable Image Example</h1>
    <div style="position: relative;">
        <img src="static/c.jpg" alt="Floor Plan" width="800" height="500">
        <a class="clickable-area" style="top: 100px; left: 100px; width: 200px; height: 200px;" onclick="highlight(this)"></a>
        <a class="clickable-area" style="top: 200px; left: 400px; width: 200px; height: 200px;" onclick="highlight(this)"></a>
        <a class="clickable-area" style="top: 100px; left: 700px; width: 200px; height: 200px;" onclick="highlight(this)"></a>
    </div>

    <script>
        function highlight(area) {
            area.classList.toggle("highlight");
        }
    </script>
</body>
</html>

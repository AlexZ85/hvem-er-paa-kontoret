<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
<title>Hei, er du på kontoret eller ei</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">

  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
         {% for dag, dato in ukedager.items() %}
         <li class="nav-item item">
        <a class="nav-link" href="#" onclick="myFunction({{ dato }})"> {{ dag }} {{ dato }} </a>
      </li>
         {% endfor %}

    </ul>
  </div>
</nav>
    <h1> Er du på kontoret?</h1>
<!-- Image Map Generated by http://www.image-map.net/ -->


{% for row in plasser %}
  <div class="rectangle" style="top: {{ row['coord'].split(',')[0] }}px; left: {{ row['coord'].split(',')[1] }}px; width: {{ row['coord'].split(',')[2] }}px;"> </div>
{% endfor %}

  <img src="static/floorplan.jpg" alt="My Image" usemap="#plasser-map">


<style>
.rectangle {
  position: absolute;
  width: 50px;
  height: 50px;
  background-color: red;
}

</style>




<script>
function myFunction(dato) {
    fetch('/my_function', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ 'dato': dato })
    })
    .then(response => response.text())
    .then(result => {
        console.log(result);
    })
    .catch(error => {
        console.error('Error:', error);
    });
}


	</script>

    <br>


</body>
</html>

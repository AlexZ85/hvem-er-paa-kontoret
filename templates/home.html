<script>
function showActiveBooked() {
  // Get the active link element
  const activeLink = document.getElementById('active-link');

  // Get the value of the data-dato attribute
  const dato = activeLink.getAttribute('data-dato');

  // Call the show_booked function with the dato value
  show_booked(dato);
}

// Get all the nav links
const navLinks = document.querySelectorAll('.nav-link');

// Add event listener to each nav link
navLinks.forEach(link => {
  link.addEventListener('click', function() {
    // Remove "active" class from all links
    navLinks.forEach(link => link.classList.remove('active'));

    // Add "active" class to the clicked link
    this.classList.add('active');


  });
});


function getCookie(name) {
  const cookieValue = document.cookie.match('(^|[^;]+)\\s*' + name + '\\s*=\\s*([^;]+)');
  return cookieValue ? cookieValue.pop() : '';
}



function check_cookie() {
  const name = getCookie("navn");
  if (name != "") {
    // The cookie exists, so you can do something with the name here
    return name
  } else {
    // The cookie doesn't exist, so you can show the popup and set the cookie
    const popup_name = prompt("Book plass under navnet:");
    if (popup_name != "" && popup_name != null) {
      document.cookie = "navn=" + popup_name + "; expires=Fri, 31 Dec 9999 23:59:59 GMT"; // Set the cookie to never expire

    }
  }
}



function show_booked(dato) {
    console.log(dato);
    return fetch('/show_booked', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ 'dato': dato })
    })
    .then(response => response.json())
    .then(result => {
        // Remove the highlight class from all clickable areas
        const clickableAreas = document.getElementsByClassName("clickable-area");
        for (let i = 0; i < clickableAreas.length; i++) {
            clickableAreas[i].classList.remove("highlight");
            clickableAreas[i].textContent = "";
        }

        // Apply the highlight class to the corresponding clickable areas
        for (let i = 0; i < result.length; i++) {
            const plassId = result[i].plass_id;
            const brukerId = result[i].bruker_id;
            const clickableArea = document.querySelector(`[title="Plass_id_${plassId}"]`);
            clickableArea.classList.add("highlight");
            const span = document.createElement("span");
            span.innerHTML = brukerId;
            span.style.position = "absolute";
            span.style.top = "50%";
            span.style.left = "50%";
            span.style.transform = "translate(-50%, -50%)";
            clickableArea.appendChild(span);
        }

        // Return the dato variable
        return dato;
    });
}


const clickableAreas = document.getElementsByClassName("clickable-area");
for (let i = 0; i < clickableAreas.length; i++) {
  let clickedAreaId = null;
  clickableAreas[i].addEventListener("click", function() {
    if (!clickableAreas[i].classList.contains("highlight")) {
      console.log("HEI")
      const cookieResult = check_cookie();
      clickedAreaId = clickableAreas[i].id;
      const activeNavLink = document.querySelector('.nav-link.active');
      const booke_dato = activeNavLink.getAttribute('data-dato');

      console.log(cookieResult, clickedAreaId,booke_dato);
      book(cookieResult, clickedAreaId, booke_dato);

    }
  });
}


function book(cookieResult, clickedAreaId, booke_dato) {
  fetch('/book', {
    method: 'POST',
    body: JSON.stringify({ 'cookie_result': cookieResult, 'clicked_area_id': clickedAreaId, 'booke_dato': booke_dato}),
    headers: {
      'Content-Type': 'application/json'
    }
  })
  .then(response => {
    if (response.ok) {
      location.reload();
    } else {
      return response.json();
    }
  })
  .then(data => console.log(data))
  .catch(error => console.error(error));
}

</script>

<!DOCTYPE html>
<html>
<head>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-GLhlTQ8iRABdZLl6O3oVMWSktQOp6b7In1Zl3/Jr59b6EGGoI1aFkw7cmDA6j6gD" crossorigin="anonymous">
<title>Hei, er du på kontoret eller ei</title>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light">

  <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>
  <div class="collapse navbar-collapse" id="navbarNav">
    <ul class="navbar-nav">
         {% for dag in ukedager %}
         <li class="nav-item item">
        <a class="nav-link" href="#">{{dag}}</a>
      </li>
         {% endfor %}

    </ul>
  </div>
</nav>
    <h1> Er du på kontoret?</h1>
    <img src="static/floorplan.jpg" usemap="#example-map">
    <map name="example-map">
		<area shape="rect" coords="10,10,50,50" onclick="myFunction()">
	</map>
<script>
		function myFunction() {
			fetch('/my_function', {
				method: 'POST',
			})
			.then(response => response.text())
			.then(result => {
				console.log(result);
			})
			.catch(error => {
				console.error('Error:', error);
			});
		}
	</script>

    <br>
    {% for plass in plasser %}
    <div>{{plass}}</div>
    {% endfor %}
</body>
</html>
